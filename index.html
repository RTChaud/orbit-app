<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbit</title>

  <!-- PWA setup -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12141c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Orbit" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/logo.png?v=4" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Notification permission banner - shown above whichever screen is active -->
  <section id="notification-banner" class="banner" hidden>
    <p id="notification-banner-text"></p>
    <button id="notification-banner-btn" class="btn btn-secondary"></button>
  </section>

  <!-- Repainted by router.js: home grid or a module's back/title/add bar -->
  <header id="app-header" class="app-header"></header>

  <!-- Repainted by router.js with the current screen's content -->
  <main id="view-root" class="app-main"></main>

  <!-- Generic modal shell - each module fills app-modal-body with its own form -->
  <div id="app-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
      <div class="modal-header">
        <h2 id="app-modal-title"></h2>
        <button id="app-modal-close" class="icon-btn" aria-label="Close"></button>
      </div>
      <div id="app-modal-body"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/push.js"></script>

  <script src="js/data/items.js"></script>
  <script src="js/data/shopping.js"></script>
  <script src="js/data/lists.js"></script>
  <script src="js/reminders.js"></script>

  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>

  <script src="js/modules/soon.js"></script>
  <script src="js/modules/upcoming.js"></script>
  <script src="js/modules/routines.js"></script>
  <script src="js/modules/tasks.js"></script>
  <script src="js/modules/shopping.js"></script>
  <script src="js/modules/lists.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/waiting.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
