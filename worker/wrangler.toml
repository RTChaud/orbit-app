name = "orbit-worker"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Runs the scheduled() handler in src/index.js once a minute to send
# any reminders that have come due. Cron Triggers are included on the
# Workers free plan at no extra cost.
[triggers]
crons = ["* * * * *"]

# The D1 database.
# NOTE: database_name must match what you actually called the database in
# Cloudflare. If you named it something other than "orbit-db", change it
# here (and in the db:init script in package.json) to match.
[[d1_databases]]
binding = "DB"
database_name = "orbit-db"
database_id = "a1455c39-8441-4d25-a2e9-a2a302982cc5"
